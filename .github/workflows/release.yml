name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK environment
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          test -n "$SDKMGR"
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"
          "$SDKMGR" --version
          yes | "$SDKMGR" --licenses > /dev/null || true

      - name: Install Android SDK platform
        run: |
          "$SDKMGR" "platforms;android-37.0" "platforms;android-37.2" "build-tools;37.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="manual-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          test -n "$APK"
          mv "$APK" "app/build/outputs/apk/release/listencord-${{ steps.tag.outputs.tag }}.apk"

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: listencord-${{ steps.tag.outputs.tag }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
